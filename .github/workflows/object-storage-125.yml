name: Object storage S3 addressing regression

on:
  push:
    branches:
      - fix/125-object-storage-bucket-lookup
    paths:
      - "backend/internal/services/object_storage_service*.go"
      - "backend/internal/config/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/object-storage-125.yml"
  pull_request:
    paths:
      - "backend/internal/services/object_storage_service*.go"
      - "backend/internal/config/**"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/object-storage-125.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Enforce formatting
        run: |
          files=(internal/services/object_storage_service.go internal/services/object_storage_service_test.go internal/config/config.go internal/config/object_storage_bucket_lookup_test.go)
          unformatted=$(gofmt -l "${files[@]}")
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Run object storage regression with JSON receipt
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/services ./internal/config -count=1 -json | tee ../object-storage-125-test.jsonl
      - name: Upload regression receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-storage-125-regression
          path: object-storage-125-test.jsonl
          if-no-files-found: warn
          retention-days: 14
